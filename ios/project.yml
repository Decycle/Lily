# XcodeGen spec for the iPad app (`xcodegen` in this folder writes Lily.xcodeproj, which is not
# committed). Your Team ID and bundle id go in Local.xcconfig (not committed; see README.md).
name: Lily
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lily:
    type: application
    platform: iOS
    configFiles:
      Debug: Lily.xcconfig
      Release: Lily.xcconfig
    sources:
      - path: Lily
    preBuildScripts:
      - name: Build Rust (wacca-app)
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_TEMP_DIR)/rust/libwacca_app.a
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_NAME: Lily
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        OTHER_LDFLAGS:
          - "$(TARGET_TEMP_DIR)/rust/libwacca_app.a"
          - "-lc++"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lily/Info.plist
    info:
      path: Lily/Info.plist
      properties:
        CFBundleDisplayName: Lily
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSupportsIndirectInputEvents: true
        # The Files app shows Lily's Documents folder (assets/, data/, save/).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Lily downloads your game files (a Lily pack) from a computer on your network.
        # Only standard HTTPS (rustls): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
