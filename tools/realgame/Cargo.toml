[package]
name = "wacca-realgame"
description = "Harness for driving/recording the real WACCA game: Waccon cell mapping, WCON framing, shared-memory layout, scripted tap timelines, game launch, FFmpeg video + WASAPI loopback recording."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
wacca-chart.workspace = true
wacca-game.workspace = true
wacca-audio.workspace = true
wacca-render.workspace = true
wacca-video.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# Same versions/features as wacca-audio / wacca-app (CONTRIBUTING "Pinned dependencies").
cpal = "0.16.0"
env_logger = { version = "0.11", default-features = false }
# Same version as wacca-convert.
png = "0.18.1"
# Same versions/features as wacca-render (headless render of our playfield for comparisons).
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
pollster = "0.4"

[lints]
workspace = true
