[package]
name = "wacca-app"
description = "WACCA_slim game binary. M4: play a single chart with audio, touch input, judgement and score."
edition.workspace = true
version.workspace = true
publish.workspace = true

# wgpu / env_logger features match wacca-render (see CONTRIBUTING "Pinned dependencies").
[dependencies]
wacca-chart.workspace = true
wacca-game.workspace = true
wacca-audio.workspace = true
wacca-render.workspace = true
log.workspace = true
thiserror.workspace = true
serde_json.workspace = true
winit = "0.30"
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
pollster = "0.4"
env_logger = { version = "0.11", default-features = false }

[lints]
workspace = true
