[package]
name = "wacca-setup"
description = "First-run import: game archives or an installed game -> portable assets/ + data/"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
wacca-audio.workspace = true
wacca-chart.workspace = true
wacca-convert = { path = "../wacca-convert" }
wacca-game.workspace = true
log.workspace = true
thiserror.workspace = true
serde_json.workspace = true
md5 = "0.8"
# `download` feature: setup from a URL (iPad and other platforms without the archives flow).
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[features]
download = ["dep:ureq", "dep:tar"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
wacca-ue4.workspace = true

[lints]
workspace = true
