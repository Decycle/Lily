[package]
name = "wacca-render"
description = "wgpu renderer: playfield, notes, effects. Spec: docs/research/04-gameplay-mechanics.md, 06-visuals.md"
edition.workspace = true
version.workspace = true
publish.workspace = true

# wgpu is held at 27 and Cargo.lock pins libloading 0.8.8 / parking_lot 0.12.4 because newer releases
# depend on `windows-link` 0.2 (raw-dylib), which needs a full MinGW `dlltool` + `as` on windows-gnu.
[dependencies]
wacca-chart.workspace = true
wacca-ue4.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
winit = "0.30"
pollster = "0.4"
env_logger = { version = "0.11", default-features = false }

[lints]
workspace = true
