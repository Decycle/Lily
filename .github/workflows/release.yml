name: Release (Windows portable)

# Manual only: Actions → "Release (Windows portable)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for a draft GitHub release (e.g. v0.1.0). Leave empty to only upload a workflow artifact."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (GNU toolchain, see CONTRIBUTING.md#toolchain)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - run: cargo test --locked --workspace
      - name: Build the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-out | Out-Null
          # Builds lily.exe and writes dist/Lily/ and dist/Lily-windows-x64.zip (7-Zip is
          # preinstalled on the windows-latest runner).
          & ./tools/make-portable.ps1
          Copy-Item dist/Lily-windows-x64.zip -Destination release-out
          $zips = @(Get-ChildItem release-out -Filter *.zip)
          if ($zips.Count -eq 0) { throw 'no zip was produced' }
          $zips | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: lily-windows-portable
          path: release-out/*.zip
          if-no-files-found: error
      - name: Draft GitHub release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # Adds the zip to the release if it exists already (e.g. made with the Android APK).
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/*.zip --clobber
          else
            gh release create "$TAG" release-out/*.zip --draft --target "$GITHUB_SHA" --title "Lily $TAG" \
              --notes "Portable Windows build. You need your own copy of WACCA Reverse (3.00.00 or newer); see docs/GUIDE.md."
          fi
